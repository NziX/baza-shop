<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bazaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b88255" />
      <stop offset="50%" stop-color="#9e6741" />
      <stop offset="100%" stop-color="#784725" />
    </linearGradient>
    <linearGradient id="bazaGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="bazaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="#0f1219" stroke="url(#bazaGoldGrad)" stroke-width="2.5" />
  
  <!-- Subtle Inner Ambient Radial -->
  <circle cx="50" cy="50" r="36" fill="url(#bazaBgGrad)" opacity="0.35" filter="url(#bazaGlow)" />

  <!-- Modern Luminaire & Chandelier Logo Icon -->
  <!-- Hanging Cord / Ceiling Mount -->
  <path d="M50 14 L50 28" stroke="url(#bazaGoldGrad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="50" cy="28" r="3" fill="#fbbf24" />

  <!-- Outer Ring (Nordic Halo) -->
  <ellipse cx="50" cy="52" rx="30" ry="12" fill="none" stroke="url(#bazaGoldGrad)" stroke-width="3" stroke-linecap="round" />
  
  <!-- Inner Ring (Ambient Core) -->
  <ellipse cx="50" cy="48" rx="18" ry="7" fill="none" stroke="#fff" stroke-width="2" opacity="0.9" />

  <!-- Radiating Ambient Light Rays -->
  <circle cx="50" cy="50" r="5" fill="#fef3c7" filter="url(#bazaGlow)" />
  <path d="M50 64 L50 78" stroke="url(#bazaGoldGrad)" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.75" />

  <!-- Subtle Lettermark B -->
  <text x="50" y="90" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#fef3c7" text-anchor="middle" letter-spacing="3">BAZA</text>
</svg>